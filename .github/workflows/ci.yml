name: Rust CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

env:
    CARGO_TERM_COLOR: always

jobs:
    build_and_test:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - name: Install Rust
            uses: dtolnay/rust-toolchain@stable
            with:
                components: rustfmt, clippy

          - name: Check formatting
            run: cargo fmt --all -- --check

          - name: Clippy (Linter)
            run: cargo clippy -- -D warnings

          - name: Run tests
            run: cargo test